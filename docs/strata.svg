<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280">
  <defs>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e131c"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0%" stop-color="#8fd8ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#2a6f9e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#05070b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="f"><rect width="880" height="280" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#f)">
    <rect width="880" height="280" fill="url(#down)"/>
    <ellipse cx="440" cy="272" rx="360" ry="150" fill="url(#core)"/>

    <!-- layers, thinning and brightening as they go down -->
    <g fill="none" stroke-linecap="round">
      <path d="M-20 44 C 140 34, 300 54, 440 46 C 580 38, 740 56, 900 46" stroke="#1c2530" stroke-width="9" opacity="0.85"/>
      <path d="M-20 82 C 150 72, 300 92, 440 84 C 580 76, 740 94, 900 84" stroke="#223040" stroke-width="8" opacity="0.9"/>
      <path d="M-20 120 C 140 110, 310 130, 440 122 C 580 114, 730 132, 900 122" stroke="#2a4055" stroke-width="7"/>
      <path d="M-20 158 C 150 148, 300 168, 440 160 C 580 152, 740 170, 900 160" stroke="#33566f" stroke-width="6"/>
      <path d="M-20 194 C 140 184, 310 204, 440 196 C 580 188, 730 206, 900 196" stroke="#3f7392" stroke-width="4.6"/>
      <path d="M-20 228 C 150 218, 300 238, 440 230 C 580 222, 740 240, 900 230" stroke="#5195ba" stroke-width="3.4"/>
      <path d="M-20 258 C 140 248, 310 268, 440 260 C 580 252, 730 270, 900 260" stroke="#7fc6e8" stroke-width="2.2"/>
    </g>

    <!-- a single shaft cut straight down through all of them -->
    <path d="M440 20 V 272" stroke="#bfe6ff" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="2 6"/>
    <g fill="#dff2ff">
      <circle cx="440" cy="46" r="2.4" opacity="0.45"/>
      <circle cx="440" cy="84" r="2.4" opacity="0.55"/>
      <circle cx="440" cy="122" r="2.4" opacity="0.65"/>
      <circle cx="440" cy="160" r="2.6" opacity="0.75"/>
      <circle cx="440" cy="196" r="2.8" opacity="0.85"/>
      <circle cx="440" cy="230" r="3.0" opacity="0.95"/>
      <circle cx="440" cy="260" r="3.6"/>
    </g>
    <circle cx="440" cy="260" r="12" fill="#7fc6e8" opacity="0.30"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="279" rx="10" fill="none" stroke="#22242b"/>
</svg>
