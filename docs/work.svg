<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .h  { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .n  { font-size: 12px; font-weight: 700; fill: #e6edf3; font-family: SFMono-Regular,Menlo,monospace; }
    .d  { font-size: 9.5px; fill: #8a9bb4; }
    .m  { font-size: 9px; fill: #5d6675; font-family: SFMono-Regular,Menlo,monospace; }
  </style>

  <rect width="880" height="430" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="429" rx="10" fill="none" stroke="#2b313d"/>

  <text x="28" y="40" font-size="15" font-weight="800" fill="#e6edf3">things I've built from scratch</text>
  <text x="852" y="40" class="m" text-anchor="end">no framework did the interesting part</text>
  <line x1="28" y1="56" x2="852" y2="56" stroke="#2b313d"/>

  <!-- systems -->
  <text x="28" y="82" class="h" fill="#dea584">SYSTEMS</text>
  <g>
    <rect x="28" y="92" width="264" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
    <circle cx="44" cy="112" r="3.5" fill="#dea584"/>
    <text x="56" y="116" class="n">bittorrent-rs</text>
    <text x="44" y="134" class="d">A full BitTorrent client in Rust — bencode</text>
    <text x="44" y="147" class="d">up to the mainline DHT, nothing borrowed.</text>
    <text x="278" y="116" class="m" text-anchor="end">~10k · 256 tests</text>

    <rect x="308" y="92" width="264" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
    <circle cx="324" cy="112" r="3.5" fill="#3572A5"/>
    <text x="336" y="116" class="n">emberkv</text>
    <text x="324" y="134" class="d">Redis-compatible store in pure Python.</text>
    <text x="324" y="147" class="d">redis-cli talks to it unmodified.</text>
    <text x="558" y="116" class="m" text-anchor="end">59 commands</text>

    <rect x="588" y="92" width="264" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
    <circle cx="604" cy="112" r="3.5" fill="#a8b9cc"/>
    <text x="616" y="116" class="n">m4-sentinel · secure-crypt</text>
    <text x="604" y="134" class="d">C11 against the Mach APIs, and an XOR</text>
    <text x="604" y="147" class="d">cipher with an honest security section.</text>
  </g>

  <!-- macOS -->
  <text x="28" y="190" class="h" fill="#5fd0de">macOS</text>
  <g>
    <rect x="28" y="200" width="264" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
    <circle cx="44" cy="220" r="3.5" fill="#F05138"/>
    <text x="56" y="224" class="n">vitrium</text>
    <text x="44" y="242" class="d">A genuinely transparent text editor.</text>
    <text x="44" y="255" class="d">AppKit, real compositor blur, no Electron.</text>
    <text x="278" y="224" class="m" text-anchor="end">53 tests</text>

    <rect x="308" y="200" width="264" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
    <circle cx="324" cy="220" r="3.5" fill="#F05138"/>
    <text x="336" y="224" class="n">minimal-notifications</text>
    <text x="324" y="242" class="d">Clipboard feedback that never asks to be</text>
    <text x="324" y="255" class="d">dismissed. The system HUD, or a sound.</text>

    <rect x="588" y="200" width="264" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
    <circle cx="604" cy="220" r="3.5" fill="#4EAA25"/>
    <text x="616" y="224" class="n">dotfile · clipsyncd</text>
    <text x="604" y="242" class="d">One machine written down — and LAN</text>
    <text x="604" y="255" class="d">clipboard sync with no cloud in the path.</text>
  </g>

  <!-- platforms -->
  <text x="28" y="298" class="h" fill="#7ddc8b">PLATFORMS &amp; TOOLS</text>
  <g>
    <rect x="28" y="308" width="264" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
    <circle cx="44" cy="328" r="3.5" fill="#f1e05a"/>
    <text x="56" y="332" class="n">forge</text>
    <text x="44" y="350" class="d">A learning-cohort platform: tasks, review</text>
    <text x="44" y="363" class="d">queues, XP, duels. No frontend framework.</text>
    <text x="278" y="332" class="m" text-anchor="end">351 tests</text>

    <rect x="308" y="308" width="264" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
    <circle cx="324" cy="328" r="3.5" fill="#3572A5"/>
    <text x="336" y="332" class="n">ripple</text>
    <text x="324" y="350" class="d">Data-incident triage for DataHub — walks</text>
    <text x="324" y="363" class="d">lineage, then writes the incident back.</text>

    <rect x="588" y="308" width="264" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.1"/>
    <circle cx="604" cy="328" r="3.5" fill="#00979D"/>
    <text x="616" y="332" class="n">hydra</text>
    <text x="604" y="350" class="d">ESP8266 watching a sewage chamber, and</text>
    <text x="604" y="363" class="d">serving its own dashboard out of PROGMEM.</text>
  </g>

  <line x1="28" y1="398" x2="852" y2="398" stroke="#2b313d"/>
  <text x="440" y="418" class="m" text-anchor="middle">C · Rust · Python · Swift · JavaScript — mostly interested in what happens below the library</text>
</svg>
